<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2ea">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Us, Maybe?</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root {
  --ink: #211d1a;
  --muted: #746b64;
  --quiet: #9a8f86;
  --paper: #fffdfa;
  --ivory: #f7f2ea;
  --ivory-2: #efe7dc;
  --rose: #b64f5e;
  --rose-dark: #943c4b;
  --rose-soft: #f3dce0;
  --sage: #72816e;
  --green: #3e7357;
  --green-soft: #dfece4;
  --amber: #9c6b2f;
  --amber-soft: #f4e8d5;
  --red: #a84646;
  --red-soft: #f4dddd;
  --line: rgba(57, 47, 42, .14);
  --shadow: 0 28px 80px rgba(52, 39, 32, .12);
  --radius: 22px;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --serif: Iowan Old Style, Palatino Linotype, Book Antiqua, Georgia, serif;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--ivory); color: var(--ink); }
body { min-height: 100%; margin: 0; font-family: var(--sans); background:
  radial-gradient(circle at 8% 5%, rgba(182,79,94,.10), transparent 28%),
  radial-gradient(circle at 92% 95%, rgba(114,129,110,.10), transparent 30%),
  var(--ivory); color: var(--ink); }
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid rgba(182,79,94,.25); outline-offset: 2px; }
[hidden] { display: none !important; }

.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 800; letter-spacing: -.03em; }
.brand-mark { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--rose); background: var(--rose-soft); }
.small-caps { margin: 0 0 14px; color: var(--rose-dark); font-size: 11px; line-height: 1.2; font-weight: 850; letter-spacing: .16em; text-transform: uppercase; }
.micro-copy, .quiet-copy { color: var(--quiet); font-size: 13px; line-height: 1.6; }

.button { min-height: 46px; padding: 0 20px; border: 1px solid transparent; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform .16s ease, background .16s ease, border-color .16s ease, opacity .16s ease; }
.button:hover:not(:disabled) { transform: translateY(-1px); }
.button:active:not(:disabled) { transform: translateY(0); }
.button:disabled { opacity: .55; cursor: wait; }
.button-primary { background: var(--rose); color: #fff; box-shadow: 0 12px 28px rgba(182,79,94,.22); }
.button-primary:hover:not(:disabled) { background: var(--rose-dark); }
.button-quiet { background: rgba(255,255,255,.72); border-color: var(--line); color: var(--ink); }
.button-quiet:hover:not(:disabled) { background: #fff; border-color: rgba(57,47,42,.25); }
.button-danger { background: var(--red); color: #fff; }
.button-danger-soft { background: var(--red-soft); color: var(--red); border-color: rgba(168,70,70,.18); }
.button-wide { width: 100%; }
.text-button, .back-link { border: 0; background: transparent; padding: 7px 0; color: var(--muted); font-size: 13px; font-weight: 750; cursor: pointer; }
.text-button:hover, .back-link:hover { color: var(--rose-dark); }

.input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: rgba(255,255,255,.92); color: var(--ink); transition: border-color .16s, box-shadow .16s; }
.input:focus { border-color: rgba(182,79,94,.5); box-shadow: 0 0 0 4px rgba(182,79,94,.08); outline: none; }
label { display: grid; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 750; }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.55; }
textarea.tall { min-height: 200px; }
.field-stack { display: grid; gap: 18px; }
.notice { padding: 13px 15px; border-radius: 13px; font-size: 13px; line-height: 1.5; }
.notice-bad { background: var(--red-soft); color: var(--red); border: 1px solid rgba(168,70,70,.18); }

/* Landing */
.home-shell { min-height: 100vh; max-width: 1240px; margin: 0 auto; padding: 26px 38px 48px; }
.home-nav { display: flex; align-items: center; justify-content: space-between; }
.home-hero { min-height: calc(100vh - 150px); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr); align-items: center; gap: 70px; padding: 60px 2vw 44px; }
.hero-copy h1 { max-width: 760px; margin: 0; font-family: var(--serif); font-size: clamp(48px, 6.6vw, 92px); font-weight: 500; line-height: .98; letter-spacing: -.055em; }
.hero-body { max-width: 650px; margin: 30px 0 0; color: var(--muted); font-size: clamp(17px, 1.8vw, 21px); line-height: 1.65; }
.hero-actions { margin-top: 30px; }
.hero-copy .micro-copy { margin-top: 16px; }
.letter-stack { position: relative; height: 560px; }
.letter-card { position: absolute; inset: 50px 20px; border-radius: 28px; background: var(--paper); border: 1px solid rgba(57,47,42,.10); box-shadow: var(--shadow); }
.letter-back { transform: rotate(-9deg) translate(-24px, 20px); background: #eaded0; }
.letter-middle { transform: rotate(6deg) translate(20px, 10px); background: #f1e5dc; }
.letter-front { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 50px; background: linear-gradient(165deg, #fffdfa 0%, #fbf1ed 100%); }
.letter-front::before { content: ""; position: absolute; inset: 20px; border: 1px solid rgba(182,79,94,.18); border-radius: 20px; }
.letter-heart { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: var(--rose-soft); color: var(--rose); }
.letter-front p { max-width: 330px; margin: 30px 0 12px; font-family: var(--serif); font-size: 38px; line-height: 1.08; }
.letter-front span { max-width: 280px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.home-strip { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.home-strip span { padding: 17px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .03em; border-right: 1px solid var(--line); }
.home-strip span:last-child { border-right: 0; }

/* Candidate */
.candidate-shell { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto; }
.candidate-header { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 12px; display: flex; align-items: center; justify-content: space-between; }
.language-chip { border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72); padding: 9px 13px; color: var(--muted); font-size: 12px; font-weight: 750; cursor: pointer; }
.candidate-progress { width: min(1040px, calc(100% - 40px)); height: 3px; margin: 2px auto 0; background: rgba(57,47,42,.08); border-radius: 999px; overflow: hidden; }
.candidate-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--rose), #cc7180); transition: width .3s cubic-bezier(.22,1,.36,1); }
.candidate-stage { width: min(1040px, calc(100% - 32px)); margin: 0 auto; display: grid; place-items: center; padding: 36px 0 56px; }
.candidate-footer { width: min(1040px, calc(100% - 40px)); min-height: 58px; margin: 0 auto; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; color: var(--quiet); font-size: 12px; }
.candidate-footer [data-state="saved"] { color: var(--green); }
.candidate-footer [data-state="error"] { color: var(--red); }
.intro-card, .question-card, .state-card { width: min(690px, 100%); padding: clamp(30px, 6vw, 62px); border: 1px solid var(--line); border-radius: 28px; background: rgba(255,253,250,.95); box-shadow: var(--shadow); }
.intro-card h1, .question-card h1, .state-card h1 { margin: 0; font-family: var(--serif); font-size: clamp(38px, 6vw, 62px); line-height: 1.04; font-weight: 500; letter-spacing: -.04em; }
.intro-card > p:not(.small-caps), .question-card > p, .state-card > p { color: var(--muted); font-size: 16px; line-height: 1.72; }
.intro-card > p:not(.small-caps) { margin: 22px 0 0; }
.choice-row { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
.language-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; margin: 28px 0 24px; }
.language-tile, .language-option { min-height: 70px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: space-between; padding: 16px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.language-tile:hover, .language-option:hover { transform: translateY(-1px); border-color: rgba(182,79,94,.34); }
.language-tile.selected, .language-option.selected { border-color: rgba(182,79,94,.6); background: var(--rose-soft); }
.language-tile strong { font-size: 15px; }
.language-tile span { color: var(--quiet); font-size: 10px; font-weight: 850; letter-spacing: .12em; }
.privacy-seal { width: 54px; height: 54px; display: grid; place-items: center; margin-bottom: 22px; border-radius: 18px; color: var(--rose); background: var(--rose-soft); }
.privacy-points { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
.privacy-points span { padding: 12px; border-radius: 13px; background: var(--ivory); text-align: center; color: var(--muted); font-size: 11px; font-weight: 750; }
.profile-layout { width: 100%; display: grid; grid-template-columns: minmax(280px, .78fr) minmax(0, 1.22fr); gap: 56px; align-items: start; }
.portrait-card { position: sticky; top: 28px; overflow: hidden; border-radius: 28px; background: #d8b9ad; box-shadow: var(--shadow); }
.portrait-monogram { aspect-ratio: 4 / 5; display: grid; place-items: center; font-family: var(--serif); font-size: 160px; color: rgba(255,255,255,.86); background:
  radial-gradient(circle at 70% 22%, rgba(255,255,255,.33), transparent 25%),
  linear-gradient(145deg, #925968, #c8867d 52%, #d7ae91); }
.portrait-caption { padding: 22px; display: grid; gap: 8px; background: var(--paper); }
.portrait-caption strong { font-family: var(--serif); font-size: 28px; font-weight: 500; }
.portrait-caption span { color: var(--muted); font-size: 13px; line-height: 1.55; }
.profile-copy h1 { margin: 0; font-family: var(--serif); font-size: clamp(42px, 5vw, 64px); line-height: 1.02; font-weight: 500; letter-spacing: -.04em; }
.trait-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0; margin: 28px 0; list-style: none; }
.trait-list li { min-height: 66px; display: flex; align-items: center; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.62); color: var(--muted); font-size: 13px; line-height: 1.4; }
.trait-list li span { color: var(--rose); flex: none; }
.honest-card { padding: 22px; border: 1px solid rgba(182,79,94,.20); border-radius: 18px; background: linear-gradient(160deg, rgba(243,220,224,.75), rgba(255,253,250,.85)); }
.honest-card h3 { margin: 0 0 10px; font-family: var(--serif); font-size: 23px; font-weight: 500; }
.honest-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.profile-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.chapter-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 24px; }
.chapter-track span { height: 4px; border-radius: 999px; background: rgba(57,47,42,.10); }
.chapter-track span.active { background: var(--rose); }
.question-card h1 { font-size: clamp(34px, 5vw, 54px); }
.question-helper { margin: 14px 0 0; color: var(--rose-dark) !important; font-size: 14px !important; font-weight: 750; }
.answer-list { display: grid; gap: 10px; margin-top: 28px; }
.answer-option { width: 100%; min-height: 58px; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 13px; text-align: left; background: rgba(255,255,255,.72); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
[dir="rtl"] .answer-option { text-align: right; }
.answer-option:hover { transform: translateY(-1px); border-color: rgba(182,79,94,.35); background: #fff; }
.answer-option.selected { border-color: rgba(182,79,94,.62); background: var(--rose-soft); }
.answer-indicator { width: 23px; height: 23px; display: grid; place-items: center; flex: none; border: 1px solid rgba(57,47,42,.18); border-radius: 50%; color: var(--rose-dark); font-size: 11px; font-weight: 900; }
.answer-option.selected .answer-indicator { border-color: var(--rose); background: var(--rose); color: #fff; }
.answer-textarea { width: 100%; min-height: 210px; margin-top: 28px; padding: 18px; border: 1px solid var(--line); border-radius: 17px; resize: vertical; background: rgba(255,255,255,.78); color: var(--ink); font-size: 16px; line-height: 1.65; }
.character-hint { margin-top: 8px; color: var(--quiet); text-align: right; font-size: 11px; }
[dir="rtl"] .character-hint { text-align: left; }
.validation-message { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 700; }
.question-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
.loading-stage { display: grid; place-items: center; gap: 16px; color: var(--muted); }
.loader-ring { width: 34px; height: 34px; border: 3px solid rgba(182,79,94,.16); border-top-color: var(--rose); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-card { text-align: center; }
.state-symbol { width: 66px; height: 66px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 50%; color: var(--rose); background: var(--rose-soft); font-size: 28px; font-weight: 900; }
.state-symbol.success { color: var(--green); background: var(--green-soft); }
.state-card p { max-width: 520px; margin: 20px auto 0; }
.state-card .button { margin-top: 24px; }
.handwritten { display: block; margin-top: 28px; font-family: var(--serif); font-size: 24px; font-style: italic; color: var(--rose-dark); }

.modal-layer, .drawer-layer { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(33,29,26,.44); backdrop-filter: blur(12px); }
.modal-card { position: relative; width: min(470px, 100%); padding: 30px; border-radius: 22px; background: var(--paper); box-shadow: 0 30px 100px rgba(33,29,26,.28); }
.modal-card h3 { margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 500; }
.modal-card p { color: var(--muted); line-height: 1.65; }
.modal-close { position: absolute; top: 12px; right: 14px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--ivory); color: var(--muted); font-size: 23px; cursor: pointer; }
[dir="rtl"] .modal-close { right: auto; left: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
.modal-icon { width: 44px; height: 44px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 14px; font-weight: 900; }
.modal-icon.danger { color: var(--red); background: var(--red-soft); }
.compact-modal { width: min(390px, 100%); }
.language-list { display: grid; gap: 8px; margin-top: 20px; }
.language-option { min-height: 52px; }

/* Auth and admin */
.auth-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth-card { width: min(500px, 100%); padding: 46px; border: 1px solid var(--line); border-radius: 26px; background: rgba(255,253,250,.96); box-shadow: var(--shadow); }
.auth-card .small-caps { margin-top: 48px; }
.auth-card h1 { margin: 0; font-family: var(--serif); font-size: 48px; line-height: 1.04; font-weight: 500; letter-spacing: -.04em; }
.auth-card > p:not(.small-caps) { color: var(--muted); line-height: 1.65; }
.auth-card form { display: grid; gap: 17px; margin-top: 28px; }
.auth-card .back-link { margin-top: 16px; }
.admin-shell { min-height: 100vh; display: grid; grid-template-columns: 246px minmax(0,1fr); background: #f4efe8; }
.admin-sidebar { position: sticky; top: 0; height: 100vh; padding: 24px 18px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: rgba(255,253,250,.90); backdrop-filter: blur(18px); }
.admin-sidebar .brand { padding: 0 9px 26px; }
.admin-sidebar nav { display: grid; gap: 5px; }
.nav-item { width: 100%; min-height: 44px; border: 0; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 11px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 760; text-align: left; cursor: pointer; }
.nav-item:hover { background: var(--ivory); color: var(--ink); }
.nav-item.active { background: var(--rose-soft); color: var(--rose-dark); }
.nav-item span { width: 18px; text-align: center; font-size: 16px; }
.sidebar-bottom { margin-top: auto; }
.admin-content { min-width: 0; padding: 32px; }
.admin-page { width: min(1320px, 100%); margin: 0 auto; }
.admin-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.admin-top h1 { margin: 0; font-family: var(--serif); font-size: 48px; line-height: 1; font-weight: 500; letter-spacing: -.04em; }
.admin-top p:not(.small-caps) { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.admin-loading { min-height: 70vh; display: grid; place-items: center; }
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.metric-card { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,253,250,.88); }
.metric-card span { display: block; color: var(--muted); font-size: 11px; font-weight: 750; }
.metric-card strong { display: block; margin-top: 14px; font-family: var(--serif); font-size: 35px; font-weight: 500; }
.candidate-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,253,250,.92); }
.panel-header { min-height: 58px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.panel-header h2, .panel-header h3 { margin: 0; font-size: 14px; }
.panel-header > span { color: var(--quiet); font-size: 11px; }
.candidate-table-head { min-height: 40px; padding: 0 15px; display: grid; grid-template-columns: minmax(250px,1.5fr) 120px 100px 190px 25px; gap: 12px; align-items: center; color: var(--quiet); font-size: 10px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.candidate-row { width: 100%; min-height: 78px; padding: 12px 15px; border: 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(250px,1.5fr) 120px 100px 190px 25px; gap: 12px; align-items: center; background: transparent; text-align: left; cursor: pointer; transition: background .14s; }
.candidate-row:last-child { border-bottom: 0; }
.candidate-row:hover { background: #fff; }
.candidate-avatar { width: 43px; height: 43px; display: grid; place-items: center; flex: none; border-radius: 14px; background: linear-gradient(145deg, var(--rose-soft), #e6c5bb); color: var(--rose-dark); font-family: var(--serif); font-size: 21px; }
.candidate-avatar.large { width: 60px; height: 60px; border-radius: 18px; font-size: 29px; }
.candidate-main { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); grid-template-rows: auto auto; column-gap: 12px; }
.candidate-main .candidate-avatar { grid-row: 1 / 3; }
.candidate-main > span { grid-column: 2; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.candidate-name-line { min-width: 0; display: flex; align-items: center; gap: 7px; }
.candidate-name-line strong { font-size: 14px; }
.online-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #43a36d; box-shadow: 0 0 0 4px rgba(67,163,109,.11); }
.online-copy { color: var(--green); font-size: 10px; font-weight: 800; }
.status-badge { display: inline-flex; min-height: 26px; align-items: center; padding: 0 9px; border-radius: 999px; font-size: 10px; font-weight: 820; }
.status-good { background: var(--green-soft); color: var(--green); }
.status-rose { background: var(--rose-soft); color: var(--rose-dark); }
.status-bad { background: var(--red-soft); color: var(--red); }
.status-neutral { background: var(--ivory-2); color: var(--muted); }
.candidate-progress-cell, .candidate-last { display: grid; gap: 3px; }
.candidate-progress-cell strong, .candidate-last strong { font-size: 12px; }
.candidate-progress-cell span, .candidate-last span { max-width: 185px; color: var(--quiet); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-arrow { color: var(--quiet); font-size: 23px; }
.empty-panel { padding: 68px 24px; text-align: center; }
.empty-panel h3 { margin: 16px 0 7px; font-family: var(--serif); font-size: 27px; font-weight: 500; }
.empty-panel p { max-width: 470px; margin: 0 auto; color: var(--muted); font-size: 13px; line-height: 1.65; }
.empty-icon { width: 54px; height: 54px; display: grid; place-items: center; margin: auto; border-radius: 18px; color: var(--rose); background: var(--rose-soft); }
.drawer-layer { place-items: stretch end; padding: 0; }
.drawer-card { width: min(500px, 100%); height: 100%; overflow-y: auto; position: relative; padding: 42px; background: var(--paper); box-shadow: -30px 0 80px rgba(33,29,26,.20); }
.drawer-card h2 { margin: 0; font-family: var(--serif); font-size: 40px; font-weight: 500; letter-spacing: -.04em; }
.drawer-card > p:not(.small-caps) { color: var(--muted); line-height: 1.6; }
.drawer-card form { margin-top: 26px; }
.created-link { margin-top: 32px; }
.success-check { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: var(--green-soft); color: var(--green); font-size: 22px; font-weight: 900; }
.created-link h3 { margin: 18px 0 8px; font-family: var(--serif); font-size: 31px; font-weight: 500; }

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
}

function safeJson(value) {
  try { return JSON.stringify(value); } catch { return "{}"; }
}

function formatDate(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }).format(date);
}

function relativeTime(value) {
  if (!value) return "Never";
  const seconds = Math.max(0, Math.round((Date.now() - new Date(value).getTime()) / 1000));
  if (seconds < 10) return "Just now";
  if (seconds < 60) return `${seconds}s ago`;
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

function toast(message, tone = "neutral") {
  const item = document.createElement("div");
  item.className = `toast toast-${tone}`;
  item.textContent = message;
  toastRoot.appendChild(item);
  requestAnimationFrame(() => item.classList.add("toast-show"));
  window.setTimeout(() => {
    item.classList.remove("toast-show");
    window.setTimeout(() => item.remove(), 240);
  }, 3200);
}

function copyText(value) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(value);
  const textarea = document.createElement("textarea");
  textarea.value = value;
  textarea.style.position = "fixed";
  textarea.style.opacity = "0";
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  textarea.remove();
  return Promise.resolve();
}

async function fetchJson(url, options = {}) {
  const response = await fetch(url, options);
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!response.ok) {
    const message = data?.error_description || data?.msg || data?.message || data?.error || `Request failed with status ${response.status}.`;
    throw new Error(message);
  }
  return data;
}

async function publicCall(body) {
  const endpoint = body.action === "bootstrap" ? "bootstrap" : body.action === "save_answer" ? "answer" : body.action === "submit" ? "submit" : body.action === "withdraw" ? "delete" : "event";
  return fetchJson(PUBLIC_FUNCTION + "/" + endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
}

function route() {
  const hash = location.hash.replace(/^#/, "");
  if (hash.startsWith("i/")) return { type: "candidate", token: decodeURIComponent(hash.slice(2)) };
  const path = location.pathname.replace(/\/+$/, "") || "/";
  if (path.startsWith("/i/")) return { type: "candidate", token: decodeURIComponent(path.slice(3)) };
  if (path === "/admin/forgot") return { type: "admin-forgot" };
  if (path === "/admin/reset") return { type: "admin-reset" };
  if (path === "/admin/secure-reset") return { type: "admin-secure-reset" };
  if (path === "/admin" || path === "/admin/login") return { type: "admin" };
  if (hash.startsWith("admin/candidate/")) return { type: "admin-candidate", id: decodeURIComponent(hash.slice("admin/candidate/".length)) };
  if (hash === "admin/profile") return { type: "admin-profile" };
  if (hash === "admin/account") return { type: "admin-account" };
  if (hash.startsWith("admin")) return { type: "admin" };
  return { type: "home" };
}

class CandidateExperience {
  constructor(token) {
    this.token = token;
    this.locale = "en";
    this.invitation = null;
    this.session = null;
    this.profile = null;
    this.answers = {};
    this.stage = "loading";
    this.index = 0;
    this.saveState = "idle";
    this.validation = "";
    this.error = "";
    this.deleted = false;
    this.textTimer = null;
    this.heartbeatTimer = null;
    this.lastViewed = "";
    this.startedText = new Set();
    this.storageKey = `um_session_${token.slice(-16)}`;
  }

  text() { return stageText[this.locale] || stageText.en; }
  questionText(question) { return question?.prompt?.[this.locale] || question?.prompt?.en || ""; }
  optionText(option) { return option?.label?.[this.locale] || option?.label?.en || ""; }
  mainQuestions() { return visibleQuestions(this.answers, false); }

  async start() {
    this.render();
    try {
      const storedSession = localStorage.getItem(this.storageKey);
      const detected = navigator.language?.toLowerCase() || "";
      const initialLocale = detected.startsWith("ru") ? "ru" : detected.startsWith("id") ? "id" : detected.startsWith("ar") ? "ar" : detected.startsWith("tr") ? "tr" : "en";
      const payload = await publicCall({ action: "bootstrap", token: this.token, sessionId: storedSession, locale: initialLocale });
      this.invitation = payload.invitation;
      this.session = payload.session;
      this.profile = payload.profile;
      this.locale = payload.session.locale || initialLocale;
      this.answers = Object.fromEntries((payload.answers || []).map((answer) => [answer.question_id, answer.value]));
      localStorage.setItem(this.storageKey, payload.session.id);
      if (payload.invitation.status === "submitted" || payload.session.status === "submitted") {
        this.stage = "complete";
      } else if (!payload.session.consented_at) {
        this.stage = "language";
      } else if (payload.session.current_screen === "profile") {
        this.stage = "profile";
      } else if (payload.session.current_question_id === "age_18") {
        this.stage = "gate"; this.index = 0;
      } else if (payload.session.current_question_id === "continue_interest") {
        this.stage = "gate"; this.index = 1;
      } else if (payload.session.current_question_id === "serious_open") {
        this.stage = "serious";
      } else if (payload.session.current_question_id) {
        this.stage = "main";
        const found = this.mainQuestions().findIndex((question) => question.id === payload.session.current_question_id);
        this.index = found >= 0 ? found : 0;
      } else {
        this.stage = "profile";
      }
      this.startHeartbeat();
      this.render();
    } catch (error) {
      this.error = error instanceof Error ? error.message : "Invitation unavailable.";
      this.stage = "error";
      this.render();
    }
  }

  cleanup() {
    if (this.textTimer) clearTimeout(this.textTimer);
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
  }

  startHeartbeat() {
    if (this.heartbeatTimer) clearInterval(this.heartbeatTimer);
    this.heartbeatTimer = setInterval(() => this.heartbeat(), 15000);
  }

  currentQuestion() {
    if (this.stage === "gate") return [questionById("age_18"), questionById("continue_interest")][this.index];
    if (this.stage === "serious") return questionById("serious_open");
    if (this.stage === "main") return this.mainQuestions()[this.index];
    return null;
  }

  progress() {
    const visible = visibleQuestions(this.answers, true);
    const completed = visible.filter((question) => {
      const value = this.answers[question.id];
      return Array.isArray(value) ? value.length > 0 : typeof value === "string" && value.trim().length > 0;
    }).length;
    return Math.round(Math.min(100, completed / Math.max(1, visible.length) * 100));
  }

  async heartbeat() {
    if (!this.session?.consented_at || ["complete", "exit", "error", "deleted"].includes(this.stage)) return;
    try {
      await publicCall({ action: "heartbeat", token: this.token, sessionId: this.session.id, screenId: this.stage, questionId: this.currentQuestion()?.id || null, progress: this.progress() });
    } catch {}
  }

  async track(eventType, payload = {}) {
    if (!this.session?.consented_at) return;
    try {
      await publicCall({ action: "track", token: this.token, sessionId: this.session.id, eventType, screenId: this.stage, questionId: this.currentQuestion()?.id || null, progress: this.progress(), payload });
    } catch {}
  }

  async setLocale(locale) {
    this.locale = locale;
    document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
    document.documentElement.lang = locale;
    this.render();
    try {
      const result = await publicCall({ action: "set_locale", token: this.token, sessionId: this.session.id, locale });
      this.session = result.session;
    } catch (error) { toast(error.message, "bad"); }
  }

  async acceptConsent() {
    this.saveState = "saving"; this.render();
    try {
      const result = await publicCall({ action: "accept_consent", token: this.token, sessionId: this.session.id });
      this.session = result.session;
      this.stage = "profile";
      this.saveState = "saved";
      this.render();
    } catch (error) {
      this.saveState = "error";
      toast(error.message, "bad");
      this.render();
    }
  }

  async saveAnswer(question, value, isDraft = true) {
    if (!this.session) return;
    this.saveState = "saving";
    this.updateSaveLabel();
    try {
      await publicCall({ action: "save_answer", token: this.token, sessionId: this.session.id, questionId: question.id, value, locale: this.locale, isDraft, progress: this.progress() });
      this.saveState = "saved";
    } catch (error) {
      this.saveState = "error";
      toast(error.message, "bad");
    }
    this.updateSaveLabel();
  }

  updateSaveLabel() {
    const node = appRoot.querySelector("[data-save-state]");
    if (!node) return;
    const t = this.text();
    node.textContent = this.saveState === "saving" ? t.saving : this.saveState === "saved" ? t.saved : this.saveState === "error" ? "Save failed" : "";
    node.dataset.state = this.saveState;
  }

  selectValue(question, optionId) {
    this.validation = "";
    let value;
    if (question.type === "multi") {
      const current = Array.isArray(this.answers[question.id]) ? [...this.answers[question.id]] : [];
      const position = current.indexOf(optionId);
      if (position >= 0) current.splice(position, 1); else current.push(optionId);
      value = current;
    } else value = optionId;
    this.answers[question.id] = value;
    this.render();
    void this.saveAnswer(question, value, true);
  }

  typeValue(question, value) {
    this.answers[question.id] = value;
    this.validation = "";
    if (!this.startedText.has(question.id)) {
      this.startedText.add(question.id);
      void this.track("text_started", { question: question.id });
    }
    if (this.textTimer) clearTimeout(this.textTimer);
    this.textTimer = setTimeout(() => void this.saveAnswer(question, value, true), 850);
    this.updateSaveLabel();
  }

  valid(question) {
    const value = this.answers[question.id];
    if (!question.required) return true;
    if (Array.isArray(value)) return value.length > 0;
    if (typeof value !== "string" || !value.trim()) return false;
    if (question.type === "text" && value.trim().length < (question.minLength || 1)) return false;
    return true;
  }

  async next() {
    const question = this.currentQuestion();
    if (!question) return;
    if (!this.valid(question)) {
      const value = this.answers[question.id];
      this.validation = question.type === "text" && typeof value === "string" && value.trim() ? this.text().moreDetail : this.text().required;
      this.render();
      return;
    }
    if (this.textTimer) { clearTimeout(this.textTimer); this.textTimer = null; }
    await this.saveAnswer(question, this.answers[question.id], true);
    await this.track("next_pressed", { question: question.id });

    if (question.id === "age_18") {
      if (this.answers.age_18 === "no") {
        try { await publicCall({ action: "withdraw", token: this.token, sessionId: this.session.id }); } catch {}
        localStorage.removeItem(this.storageKey);
        this.stage = "exit";
        this.exitReason = "underage";
      } else { this.index = 1; }
    } else if (question.id === "continue_interest") {
      if (["friendship", "casual", "no"].includes(this.answers.continue_interest)) {
        await this.earlySubmit();
        return;
      }
      this.stage = "serious";
    } else if (question.id === "serious_open") {
      if (["casual", "no"].includes(this.answers.serious_open)) {
        await this.earlySubmit();
        return;
      }
      this.stage = "main";
      this.index = 0;
    } else if (this.stage === "main") {
      const list = this.mainQuestions();
      if (this.index >= list.length - 1) {
        await this.submit();
        return;
      }
      this.index += 1;
    }
    this.render();
  }

  async earlySubmit() {
    try {
      await publicCall({ action: "submit", token: this.token, sessionId: this.session.id, finalInterest: "no" });
    } catch {}
    this.stage = "exit";
    this.exitReason = "normal";
    this.render();
  }

  async submit() {
    const finalMap = { yes: "yes", slow: "yes_slowly", discuss: "yes_discuss", unsure: "unsure", no: "no" };
    const finalInterest = finalMap[this.answers.final_interest] || "unsure";
    this.saveState = "saving"; this.render();
    try {
      await publicCall({ action: "submit", token: this.token, sessionId: this.session.id, finalInterest });
      this.stage = "complete";
      this.saveState = "saved";
      this.render();
    } catch (error) {
      this.saveState = "error";
      toast(error.message, "bad");
      this.render();
    }
  }

  back() {
    void this.track("back_pressed", {});
    this.validation = "";
    if (this.stage === "welcome") this.stage = "language";
    else if (this.stage === "consent") this.stage = "welcome";
    else if (this.stage === "profile") this.stage = "consent";
    else if (this.stage === "gate" && this.index > 0) this.index -= 1;
    else if (this.stage === "gate") this.stage = "profile";
    else if (this.stage === "serious") { this.stage = "gate"; this.index = 1; }
    else if (this.stage === "main" && this.index > 0) this.index -= 1;
    else if (this.stage === "main") this.stage = "serious";
    this.render();
  }

  async deleteData() {
    if (!this.session) return;
    const button = appRoot.querySelector("[data-delete-confirm]");
    if (button) button.disabled = true;
    try {
      await publicCall({ action: "withdraw", token: this.token, sessionId: this.session.id });
      localStorage.removeItem(this.storageKey);
      this.stage = "deleted";
      this.render();
    } catch (error) { toast(error.message, "bad"); if (button) button.disabled = false; }
  }

  renderShell(content, options = {}) {
    const t = this.text();
    const dir = this.locale === "ar" ? "rtl" : "ltr";
    document.documentElement.dir = dir;
    document.documentElement.lang = this.locale;
    const progress = options.progress ? `<div class="candidate-progress"><span style="width:${this.progress()}%"></span></div>` : "";
    return `<main class="candidate-shell" dir="${dir}">
      <header class="candidate-header">
        <div class="brand"><span class="brand-mark">${heartMark(18)}</span><span>Us, Maybe?</span></div>
        <button class="language-chip" data-language-menu>${escapeHtml(languageDisplay[this.locale])}</button>
      </header>
      ${progress}
      <section class="candidate-stage">${content}</section>
      <footer class="candidate-footer">
        <span data-save-state data-state="${this.saveState}">${this.saveState === "saving" ? t.saving : this.saveState === "saved" ? t.saved : ""}</span>
        ${this.session?.consented_at && !["deleted", "exit", "error"].includes(this.stage) ? `<button class="text-button" data-delete-open>${escapeHtml(t.deleteData)}</button>` : ""}
      </footer>
      <div class="modal-layer" data-language-modal hidden>
        <div class="modal-card compact-modal"><button class="modal-close" data-modal-close aria-label="Close">×</button><h3>${escapeHtml(t.chooseLanguage)}</h3><div class="language-list">${Object.entries(languageDisplay).map(([key, label]) => `<button class="language-option ${key === this.locale ? "selected" : ""}" data-locale="${key}">${escapeHtml(label)}</button>`).join("")}</div></div>
      </div>
      <div class="modal-layer" data-delete-modal hidden>
        <div class="modal-card"><button class="modal-close" data-modal-close aria-label="Close">×</button><div class="modal-icon danger">!</div><h3>${escapeHtml(t.deleteData)}</h3><p>${escapeHtml(t.deleteConfirm)}</p><div class="modal-actions"><button class="button button-quiet" data-modal-close>${escapeHtml(t.cancel)}</button><button class="button button-danger" data-delete-confirm>${escapeHtml(t.deletePermanent)}</button></div></div>
      </div>
    </main>`;
  }

  render() {
    const t = this.text();
    let html = "";
    if (this.stage === "loading") {
      html = this.renderShell(`<div class="loading-stage"><div class="loader-ring"></div><p>Opening your invitation…</p></div>`);
    } else if (this.stage === "error") {
      html = this.renderShell(`<div class="state-card"><div class="state-symbol">${heartMark(30)}</div><h1>${escapeHtml(t.unavailable)}</h1><p>${escapeHtml(this.error)}</p><button class="button button-primary" data-retry>Try again</button></div>`);
    } else if (this.stage === "language") {
      html = this.renderShell(`<div class="intro-card"><p class="small-caps">${escapeHtml(t.privateInvitation)}</p><h1>${escapeHtml(t.chooseLanguage)}</h1><p>${escapeHtml(t.honest)}</p><div class="language-grid">${Object.entries(languageDisplay).map(([key, label]) => `<button class="language-tile ${key === this.locale ? "selected" : ""}" data-locale="${key}"><strong>${escapeHtml(label)}</strong><span>${key.toUpperCase()}</span></button>`).join("")}</div><button class="button button-primary button-wide" data-stage="welcome">${escapeHtml(t.continue)}</button></div>`);
    } else if (this.stage === "welcome") {
      html = this.renderShell(`<div class="intro-card"><p class="small-caps">${escapeHtml(t.privateInvitation)}</p><h1>${escapeHtml(t.welcomeTitle(this.invitation?.first_name || "there"))}</h1><p>${escapeHtml(t.welcomeBody)}</p><div class="choice-row"><button class="button button-primary" data-stage="consent">${escapeHtml(t.curious)}</button><button class="button button-quiet" data-exit>${escapeHtml(t.notForMe)}</button></div><button class="back-link" data-back>← ${escapeHtml(t.back)}</button></div>`);
    } else if (this.stage === "consent") {
      html = this.renderShell(`<div class="intro-card"><div class="privacy-seal">${heartMark(24)}</div><h1>${escapeHtml(t.privacyTitle)}</h1><p>${escapeHtml(t.privacyBody)}</p><div class="privacy-points"><span>Answers and drafts</span><span>Choices and changes</span><span>Question and navigation events</span></div><div class="choice-row"><button class="button button-primary" data-consent>${escapeHtml(t.understand)}</button><button class="button button-quiet" data-exit>${escapeHtml(t.leave)}</button></div><button class="back-link" data-back>← ${escapeHtml(t.back)}</button></div>`);
    } else if (this.stage === "profile") {
      const traits = t.traits.map((trait) => `<li><span>${heartMark(15)}</span>${escapeHtml(trait)}</li>`).join("");
      html = this.renderShell(`<div class="profile-layout"><div class="portrait-card"><div class="portrait-monogram">N</div><div class="portrait-caption"><strong>Naim</strong><span>${escapeHtml(t.profileIntro)}</span></div></div><div class="profile-copy"><p class="small-caps">${escapeHtml(t.meet)}</p><h1>Hi. This is the honest version.</h1><ul class="trait-list">${traits}</ul><div class="honest-card"><h3>${escapeHtml(t.shouldKnow)}</h3><p>${escapeHtml(t.difficult)}</p></div><div class="profile-actions"><button class="button button-quiet" data-back>${escapeHtml(t.back)}</button><button class="button button-primary" data-begin>${escapeHtml(t.continue)}</button></div></div></div>`, { progress: true });
    } else if (["gate", "serious", "main"].includes(this.stage)) {
      html = this.renderQuestion();
    } else if (this.stage === "complete") {
      html = this.renderShell(`<div class="state-card success-state"><div class="state-symbol success">${heartMark(34)}</div><h1>${escapeHtml(t.completeTitle)}</h1><p>${escapeHtml(t.completeBody)}</p><span class="handwritten">${escapeHtml(t.takeCare)}</span></div>`);
    } else if (this.stage === "exit") {
      const body = this.exitReason === "underage" ? t.underage : t.exitBody;
      html = this.renderShell(`<div class="state-card"><div class="state-symbol">${heartMark(30)}</div><h1>${escapeHtml(t.exitTitle)}</h1><p>${escapeHtml(body)}</p></div>`);
    } else if (this.stage === "deleted") {
      html = this.renderShell(`<div class="state-card"><div class="state-symbol success">✓</div><h1>${escapeHtml(t.deleted)}</h1><p>${escapeHtml(t.takeCare)}</p></div>`);
    }
    appRoot.innerHTML = html;
    this.bind();
  }

  renderQuestion() {
    const t = this.text();
    const question = this.currentQuestion();
    if (!question) return this.renderShell(`<div class="state-card"><h1>${escapeHtml(t.unavailable)}</h1></div>`);
    const value = this.answers[question.id];
    const main = this.stage === "main";
    const sectionIndex = main ? MAIN_SECTION_ORDER.indexOf(question.section) + 1 : 0;
    const eyebrow = this.stage === "serious" ? t.bigQuestion : main ? `${t.part} ${sectionIndex} ${t.of} 6` : sectionLabels.gate[this.locale];
    let control = "";
    if (question.type === "text") {
      control = `<textarea class="answer-textarea" data-text-answer placeholder="${escapeHtml(this.locale === "en" ? "Write freely. Honest detail helps." : "…")}">${escapeHtml(typeof value === "string" ? value : "")}</textarea><div class="character-hint">${typeof value === "string" ? value.trim().length : 0}${question.minLength ? ` / ${question.minLength}+` : ""}</div>`;
    } else {
      control = `<div class="answer-list">${(question.options || []).map((option) => {
        const selected = Array.isArray(value) ? value.includes(option.id) : value === option.id;
        return `<button class="answer-option ${selected ? "selected" : ""}" data-option="${escapeHtml(option.id)}"><span class="answer-indicator">${question.type === "multi" ? (selected ? "✓" : "") : (selected ? "●" : "")}</span><span>${escapeHtml(this.optionText(option))}</span></button>`;
      }).join("")}</div>`;
    }
    const helper = question.helper ? `<p class="question-helper">${escapeHtml(question.helper[this.locale] || question.helper.en)}</p>` : "";
    const nextText = main && this.index >= this.mainQuestions().length - 1 ? t.submit : t.saveContinue;
    const chapter = main ? `<div class="chapter-track">${MAIN_SECTION_ORDER.map((section, index) => `<span class="${index + 1 <= sectionIndex ? "active" : ""}"></span>`).join("")}</div>` : "";
    const questionHtml = `<div class="question-card">${chapter}<p class="small-caps">${escapeHtml(eyebrow)}</p><h1>${escapeHtml(this.questionText(question))}</h1>${helper}${control}${this.validation ? `<div class="validation-message">${escapeHtml(this.validation)}</div>` : ""}<div class="question-actions"><button class="button button-quiet" data-back>${escapeHtml(t.back)}</button><button class="button button-primary" data-next>${escapeHtml(nextText)}</button></div></div>`;
    if (this.lastViewed !== `${this.stage}:${question.id}`) {
      this.lastViewed = `${this.stage}:${question.id}`;
      queueMicrotask(() => void this.track("question_viewed", { question: question.id }));
    }
    return this.renderShell(questionHtml, { progress: true });
  }

  bind() {
    appRoot.querySelectorAll("[data-locale]").forEach((button) => button.addEventListener("click", () => {
      void this.setLocale(button.dataset.locale);
      const modal = appRoot.querySelector("[data-language-modal]");
      if (modal) modal.hidden = true;
    }));
    appRoot.querySelector("[data-language-menu]")?.addEventListener("click", () => { appRoot.querySelector("[data-language-modal]").hidden = false; });
    appRoot.querySelectorAll("[data-modal-close]").forEach((button) => button.addEventListener("click", () => button.closest(".modal-layer").hidden = true));
    appRoot.querySelector("[data-delete-open]")?.addEventListener("click", () => { void this.track("delete_dialog_opened", {}); appRoot.querySelector("[data-delete-modal]").hidden = false; });
    appRoot.querySelector("[data-delete-confirm]")?.addEventListener("click", () => void this.deleteData());
    appRoot.querySelector("[data-retry]")?.addEventListener("click", () => this.start());
    appRoot.querySelectorAll("[data-stage]").forEach((button) => button.addEventListener("click", () => { this.stage = button.dataset.stage; this.render(); }));
    appRoot.querySelector("[data-consent]")?.addEventListener("click", () => void this.acceptConsent());
    appRoot.querySelector("[data-begin]")?.addEventListener("click", () => { this.stage = "gate"; this.index = 0; this.render(); });
    appRoot.querySelectorAll("[data-back]").forEach((button) => button.addEventListener("click", () => this.back()));
    appRoot.querySelectorAll("[data-exit]").forEach((button) => button.addEventListener("click", async () => {
      if (this.session?.consented_at) await this.earlySubmit(); else { this.stage = "exit"; this.exitReason = "normal"; this.render(); }
    }));
    const question = this.currentQuestion();
    if (question) {
      appRoot.querySelectorAll("[data-option]").forEach((button) => button.addEventListener("click", () => this.selectValue(question, button.dataset.option)));
      appRoot.querySelector("[data-text-answer]")?.addEventListener("input", (event) => {
        this.typeValue(question, event.target.value);
        const hint = appRoot.querySelector(".character-hint");
        if (hint) hint.textContent = `${event.target.value.trim().length}${question.minLength ? ` / ${question.minLength}+` : ""}`;
      });
      appRoot.querySelector("[data-next]")?.addEventListener("click", () => void this.next());
    }
  }
}

const AUTH_KEY = "um_owner_auth_v2";

function getStoredAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch { return null; }
}

function saveAuth(value) {
  if (value) localStorage.setItem(AUTH_KEY, JSON.stringify(value)); else localStorage.removeItem(AUTH_KEY);
}

async function passwordLogin(email, password) {
  const data = await fetchJson(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });
  const expiresAt = data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600);
  const session = { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: expiresAt, user: data.user };
  saveAuth(session);
  return session;
}

async function requestPasswordReset(email) {
  return fetchJson(`${SUPABASE_URL}/auth/v1/recover`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, redirect_to: `${baseUrl()}/admin/reset` })
  });
}

function recoverySession() {
  const values = new URLSearchParams(location.hash.replace(/^#/, ""));
  const accessToken = values.get("access_token");
  if (!accessToken || values.get("type") !== "recovery") return null;
  return { access_token: accessToken, refresh_token: values.get("refresh_token"), expires_at: Math.floor(Date.now() / 1000) + Number(values.get("expires_in") || 3600) };
}

function ownerResetToken() {
  return new URLSearchParams(location.hash.replace(/^#/, "")).get("token") || "";
}

async function completeOwnerReset(token, password) {

    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ token, password })
  });
}

async function refreshAuth(session) {
  const data = await fetchJson(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  const next = { access_token: data.access_token, refresh_token: data.refresh_token || session.refresh_token, expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600), user: data.user || session.user };
  saveAuth(next);
  return next;
}

async function validAuth() {
  let session = getStoredAuth();
  if (!session?.access_token) return null;
  if ((session.expires_at || 0) < Math.floor(Date.now() / 1000) + 60) {
    try { session = await refreshAuth(session); } catch { saveAuth(null); return null; }
  }
  return session;
}

async function restRequest(path, options = {}, retry = true) {
  let session = await validAuth();
  if (!session) throw new Error("AUTH_REQUIRED");
  const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, Accept: "application/json", ...(options.headers || {}) };
  if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers });
  if (response.status === 401 && retry) {
    try { await refreshAuth(session); return restRequest(path, options, false); } catch { saveAuth(null); throw new Error("AUTH_REQUIRED"); }
  }
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!response.ok) throw new Error(data?.message || data?.error || `Database request failed with status ${response.status}.`);
  return data;
}

async function dbGet(table, query = "") { return restRequest(`${table}${query ? `?${query}` : ""}`); }
async function dbPatch(table, filter, body) { return restRequest(`${table}?${filter}`, { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) }); }
async function rpc(name, body) { return restRequest(`rpc/${name}`, { method: "POST", body: JSON.stringify(body) }); }

function online(session) {
  return Boolean(session && session.status === "active" && Date.now() - new Date(session.last_seen_at).getTime() < 35000);
}

}

class AdminDashboard {
  constructor() {
    this.interval = null;
    this.invitations = [];
    this.sessions = [];
    this.answers = [];
    this.snapshot = "";
    this.refreshing = false;
    this.drawerOpen = false;
    this.pendingRender = false;
  }
  cleanup() { if (this.interval) clearInterval(this.interval); this.interval = null; }
  async start() {
    if (!(await validAuth())) { renderAdminLogin(); return; }
    appRoot.innerHTML = adminShell(`<div class="admin-loading"><div class="loader-ring"></div></div>`);
    bindAdminShell();
    try {
      await this.load();
      this.interval = setInterval(() => this.load(true), 4000);
    } catch (error) {
      if (error.message === "AUTH_REQUIRED") { renderAdminLogin(); return; }
      appRoot.innerHTML = adminShell(`<div class="state-card"><h1>Dashboard unavailable</h1><p>${escapeHtml(error.message)}</p><button class="button button-primary" data-retry>Retry</button></div>`);
      bindAdminShell();
      appRoot.querySelector("[data-retry]")?.addEventListener("click", () => this.start());
    }
  }
  async load(silent = false) {
    if (silent && this.refreshing) return;
    this.refreshing = true;
    try {
      const [invitations, sessions, answers] = await Promise.all([
        dbGet("um_invitations", "select=*&order=created_at.desc&limit=200"),
        dbGet("um_sessions", "select=*&order=last_seen_at.desc&limit=1000"),
        dbGet("um_answers", "select=invitation_id,question_id,updated_at&order=updated_at.desc&limit=5000")
      ]);
      const next = { invitations: invitations || [], sessions: sessions || [], answers: answers || [] };
      const snapshot = JSON.stringify(next);
      const changed = snapshot !== this.snapshot;
      this.invitations = next.invitations; this.sessions = next.sessions; this.answers = next.answers;
      this.snapshot = snapshot;
      if (!silent || changed || this.pendingRender) {
        if (silent && this.drawerOpen) { this.pendingRender = true; return; }
        this.pendingRender = false;
        this.render();
      }
    } finally {
      this.refreshing = false;
    }
  }
  latestSession(id) { return this.sessions.find((session) => session.invitation_id === id) || null; }
  answerCount(id) { return this.answers.filter((answer) => answer.invitation_id === id).length; }

    const submitted = this.invitations.filter((invite) => invite.status === "submitted").length;
    const review = this.invitations.filter((invite) => invite.status === "submitted" && invite.review_status === "unreviewed").length;

      const session = this.latestSession(invite.id);
      const isOnline = online(session);
      return `<button class="candidate-row" data-candidate="${invite.id}"><div class="candidate-avatar">${escapeHtml(invite.first_name.slice(0, 1).toUpperCase())}</div><div class="candidate-main"><div class="candidate-name-line"><strong>${escapeHtml(invite.first_name)}</strong>${isOnline ? `<span class="online-dot"></span><span class="online-copy">Online</span>` : ""}</div><span>${escapeHtml(invite.source || "Private invitation")} · ${escapeHtml(languageDisplay[invite.language_hint] || "Any language")}</span></div><div class="candidate-status">${statusBadge(invite.status)}</div><div class="candidate-progress-cell"><strong>${Math.round(Number(session?.progress || 0))}%</strong><span>${this.answerCount(invite.id)} answers</span></div><div class="candidate-last"><strong>${relativeTime(session?.last_seen_at || invite.updated_at)}</strong><span>${escapeHtml(session?.current_question_id || session?.current_screen || "Not opened")}</span></div><div class="row-arrow">›</div></button>`;

on button-primary button-wide" type="submit">Create private link</button></form><div data-created-link></div></div></div>`, "candidates");
    bindAdminShell();
    appRoot.querySelectorAll("[data-candidate]").forEach((button) => button.addEventListener("click", () => setRoute(`admin/candidate/${button.dataset.candidate}`)));
    const drawer = appRoot.querySelector("[data-invite-drawer]");
    appRoot.querySelector("[data-new-invite]")?.addEventListener("click", () => { this.drawerOpen = true; drawer.hidden = false; drawer.querySelector("input")?.focus(); });
    appRoot.querySelector("[data-close-drawer]")?.addEventListener("click", () => { this.drawerOpen = false; this.render(); });

    const form = event.currentTarget;

    try {
      let result = await rpc("um_admin_create_invitation", { p_first_name: form.firstName.value.trim(), p_language_hint: form.language.value || null, p_source: form.source.value.trim() || null, p_expires_in_days: Number(form.days.value), p_experience_mode: "full" });

      created.querySelector("[data-open-created]").addEventListener("click", () => setRoute(`admin/candidate/${result.id}`));
      await this.load(true);
    } catch (error) {
      toast(error.message, "bad");
      button.disabled = false; button.textContent = "Create private link";
    }
  }
}

class CandidateDetail {
  constructor(id) { this.id = id; this.interval = null; this.tab = "summary"; this.bundle = null; this.snapshot = ""; this.refreshing = false; this.pendingRender = false; }

  async start() {
    if (!(await validAuth())) { renderAdminLogin(); return; }

    bindAdminShell();
    try { await this.load(); this.interval = setInterval(() => this.load(true), 3000); }

  }
  async load(silent = false) {
    if (silent && this.refreshing) return;
    this.refreshing = true;
    try {
      const filter = `invitation_id=eq.${encodeURIComponent(this.id)}`;
      const [invites, sessions, answers, revisions, events] = await Promise.all([
        dbGet("um_invitations", `select=*&id=eq.${encodeURIComponent(this.id)}&limit=1`),
        dbGet("um_sessions", `select=*&${filter}&order=started_at.desc`),
        dbGet("um_answers", `select=*&${filter}&order=created_at.asc`),
        dbGet("um_answer_revisions", `select=*&${filter}&order=created_at.desc&limit=300`),
        dbGet("um_activity_events", `select=*&${filter}&order=created_at.desc&limit=400`)
      ]);
      if (!invites?.length) throw new Error("Candidate not found.");
      const answerMap = Object.fromEntries((answers || []).map((answer) => [answer.question_id, answer.value]));
      const next = { invitation: invites[0], sessions: sessions || [], answers: answers || [], revisions: revisions || [], events: events || [], answerMap, score: scoreAnswers(answerMap) };
      const snapshot = JSON.stringify(next);
      const changed = snapshot !== this.snapshot;
      this.bundle = next;
      this.snapshot = snapshot;
      const focused = document.activeElement;
      const editing = focused && appRoot.contains(focused) && ["INPUT", "TEXTAREA", "SELECT"].includes(focused.tagName);
      if (!silent || changed || this.pendingRender) {
        if (silent && editing) { this.pendingRender = true; return; }
        this.pendingRender = false;
        this.render();
      }
    } finally {
      this.refreshing = false;
    }
  }
  latestSession() { return this.bundle.sessions[0] || null; }
  render() {
    this.pendingRender = false;
    const { invitation, answers, revisions, events, score } = this.bundle;
    const session = this.latestSession();
    const isOnline = online(session);
    const tabButtons = ["summary", "answers", "activity", "revisions"].map((tab) => `<button class="detail-tab ${this.tab === tab ? "active" : ""}" data-tab="${tab}">${tab[0].toUpperCase() + tab.slice(1)}${tab === "answers" ? ` <span>${answers.length}</span>` : tab === "activity" ? ` <span>${events.length}</span>` : tab === "revisions" ? ` <span>${revisions.length}</span>` : ""}</button>`).join("");
    let body = this.tab === "summary" ? this.renderSummary() : this.tab === "answers" ? this.renderAnswers() : this.tab === "activity" ? this.renderActivity() : this.renderRevisions();
    const storedLink = localStorage.getItem(`um_invite_link_${invitation.id}`);
    appRoot.innerHTML = adminShell(`<div class="admin-page detail-page"><header class="detail-header"><button class="back-circle" data-back-admin>‹</button><div class="candidate-avatar large">${escapeHtml(invitation.first_name.slice(0, 1).toUpperCase())}</div><div class="detail-identity"><div class="candidate-name-line"><h1>${escapeHtml(invitation.first_name)}</h1>${isOnline ? `<span class="online-dot"></span><span class="online-copy">Online now</span>` : ""}</div><p>${escapeHtml(invitation.source || "Private invitation")} · ${escapeHtml(languageDisplay[invitation.language_hint] || session?.locale || "Any language")}</p><div class="detail-meta">${statusBadge(invitation.status)}<span>${Math.round(Number(session?.progress || 0))}% complete</span><span>Last active ${relativeTime(session?.last_seen_at || invitation.updated_at)}</span></div></div><div class="detail-actions">${storedLink ? `<button class="button button-quiet" data-copy-link>Copy link</button>` : ""}<button class="button button-primary" data-rotate>${storedLink ? "Replace link" : "Generate link"}</button></div></header><div class="live-strip"><div><span class="live-label">Current screen</span><strong>${escapeHtml(session?.current_question_id ? questionById(session.current_question_id)?.prompt?.en || session.current_question_id : session?.current_screen || "Not opened")}</strong></div><div><span class="live-label">Saved answers</span><strong>${answers.length}</strong></div><div><span class="live-label">Session</span><strong>${isOnline ? "Live" : session?.status || "Not started"}</strong></div><div><span class="live-label">Invitation expires</span><strong>${formatDate(invitation.expires_at)}</strong></div></div><div class="detail-tabs">${tabButtons}</div>${body}</div>`, "candidates");
    bindAdminShell();
    appRoot.querySelector("[data-back-admin]")?.addEventListener("click", () => setRoute("admin"));
    appRoot.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", () => { this.tab = button.dataset.tab; this.render(); }));
    appRoot.querySelector("[data-copy-link]")?.addEventListener("click", async () => { await copyText(storedLink); toast("Invitation link copied", "good"); });
    appRoot.querySelector("[data-rotate]")?.addEventListener("click", () => void this.rotateLink());
    appRoot.querySelectorAll("[data-review]").forEach((button) => button.addEventListener("click", () => void this.saveReview(button.dataset.review)));
    appRoot.querySelector("[data-save-notes]")?.addEventListener("click", () => void this.saveNotes());
    appRoot.querySelector("[data-revoke]")?.addEventListener("click", () => void this.revoke());
    appRoot.querySelector("[data-restore]")?.addEventListener("click", () => void this.restore());
  }
  renderSummary() {
    const { invitation, score } = this.bundle;
    const dimensions = score.dimensions.map((dimension) => `<div class="dimension-card"><div class="dimension-top"><span>${escapeHtml(dimensionLabel[dimension.key])}</span><strong>${dimension.score === null ? "—" : Math.round(dimension.score)}</strong></div><div class="dimension-bar"><span style="width:${dimension.score || 0}%"></span></div><div class="dimension-bottom"><span class="alignment alignment-${dimension.label}">${escapeHtml(alignmentLabel[dimension.label])}</span><span>Weight ${dimension.weight}%</span></div></div>`).join("");
    const flags = [
      ["Hard mismatches", score.hardMismatches, "bad"],
      ["Character concerns", score.characterConcerns, "danger"],
      ["Contradictions", score.contradictions, "warn"],
      ["Questions to discuss", score.followUps, "neutral"]
    ].map(([title, list, tone]) => `<section class="flag-panel flag-${tone}"><div class="panel-header"><h3>${title}</h3><span>${list.length}</span></div>${list.length ? `<ul>${list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : `<p class="quiet-copy">Nothing detected from the answers saved so far.</p>`}</section>`).join("");
    return `<section class="summary-grid"><div class="summary-main"><div class="score-head"><div><p class="small-caps">Private compatibility view</p><h2>${score.overall === null ? "Not enough information" : `${Math.round(score.overall)}% weighted alignment`}</h2><p>The dimensional evidence matters more than the average.</p></div><div class="score-ring" style="--score:${score.overall || 0}"><span>${score.overall === null ? "—" : Math.round(score.overall)}</span></div></div><div class="dimension-grid">${dimensions}</div><div class="flag-grid">${flags}</div></div><aside class="review-panel"><p class="small-caps">Your decision</p><h3>What happens next?</h3><div class="review-options">${["unreviewed", "continue", "discuss", "close", "archived"].map((status) => `<button class="review-option ${invitation.review_status === status ? "selected" : ""}" data-review="${status}">${status.replaceAll("_", " ")}</button>`).join("")}</div><label class="notes-label">Private notes<textarea class="input notes-area" data-private-notes>${escapeHtml(invitation.private_notes || "")}</textarea></label><button class="button button-primary button-wide" data-save-notes>Save notes</button><hr><h4>Invitation control</h4>${invitation.status === "revoked" ? `<button class="button button-quiet button-wide" data-restore>Restore with a new link</button>` : `<button class="button button-danger-soft button-wide" data-revoke>Revoke current link</button>`}</aside></section>`;
  }
  renderAnswers() {
    if (!this.bundle.answers.length) return `<div class="empty-panel"><h3>No answers saved yet</h3><p>Partial responses appear here as soon as the candidate selects or types them.</p></div>`;
    return `<section class="answer-review-list">${this.bundle.answers.map((answer, index) => {
      const question = questionById(answer.question_id);
      const displayed = labelForAnswer(question, answer.value, answer.locale || "en");
      const isText = question?.type === "text";
      return `<article class="answer-review-card"><div class="answer-number">${index + 1}</div><div><p class="answer-question">${escapeHtml(question?.prompt?.en || answer.question_id)}</p><div class="answer-value ${isText ? "long-answer" : ""}">${escapeHtml(displayed || "No answer")}</div><div class="answer-meta"><span>${escapeHtml(languageDisplay[answer.locale] || answer.locale)}</span><span>${answer.is_draft ? "Draft" : "Submitted"}</span><span>Updated ${relativeTime(answer.updated_at)}</span></div></div></article>`;
    }).join("")}</section>`;
  }
  renderActivity() {
    if (!this.bundle.events.length) return `<div class="empty-panel"><h3>No activity yet</h3><p>Meaningful events appear after the invitation is opened.</p></div>`;
    return `<section class="timeline">${this.bundle.events.map((event) => `<article class="timeline-item"><div class="timeline-dot"></div><div class="timeline-card"><div class="timeline-top"><strong>${escapeHtml(eventNames[event.event_type] || event.event_type.replaceAll("_", " "))}</strong><span>${relativeTime(event.created_at)}</span></div><p>${escapeHtml(event.question_id ? questionById(event.question_id)?.prompt?.en || event.question_id : event.screen_id || "")}</p>${event.payload && Object.keys(event.payload).length ? `<details><summary>Event details</summary><pre>${escapeHtml(JSON.stringify(event.payload, null, 2))}</pre></details>` : ""}</div></article>`).join("")}</section>`;
  }
  renderRevisions() {
    if (!this.bundle.revisions.length) return `<div class="empty-panel"><h3>No answer changes yet</h3><p>Earlier saved versions appear after a response changes.</p></div>`;
    return `<section class="revision-list">${this.bundle.revisions.map((revision) => { const question = questionById(revision.question_id); return `<article class="revision-card"><div class="revision-head"><strong>${escapeHtml(question?.prompt?.en || revision.question_id)}</strong><span>${formatDate(revision.created_at)}</span></div><div class="revision-comparison"><div><span>Before</span><p>${escapeHtml(labelForAnswer(question, revision.previous_value, revision.locale) || "Empty")}</p></div><div class="revision-arrow">→</div><div><span>After</span><p>${escapeHtml(labelForAnswer(question, revision.new_value, revision.locale) || "Empty")}</p></div></div></article>`; }).join("")}</section>`;
  }
  async rotateLink() {
    const button = appRoot.querySelector("[data-rotate]");
    button.disabled = true; button.textContent = "Generating…";
    try {
      let result = await rpc("um_admin_rotate_invitation", { p_invitation_id: this.id, p_expires_in_days: 14 });
      if (Array.isArray(result)) result = result[0];
      const link = `${baseUrl()}#i/${result.token}`;
      localStorage.setItem(`um_invite_link_${this.id}`, link);
      await copyText(link);
      toast("New invitation link copied. The old link no longer works.", "good");
      await this.load(true);
    } catch (error) { toast(error.message, "bad"); }
  }
  async saveReview(review) {
    try { await dbPatch("um_invitations", `id=eq.${encodeURIComponent(this.id)}`, { review_status: review }); this.bundle.invitation.review_status = review; this.render(); toast("Decision saved", "good"); }
    catch (error) { toast(error.message, "bad"); }
  }
  async saveNotes() {
    const notes = appRoot.querySelector("[data-private-notes]").value;
    try { await dbPatch("um_invitations", `id=eq.${encodeURIComponent(this.id)}`, { private_notes: notes }); this.bundle.invitation.private_notes = notes; toast("Private notes saved", "good"); }
    catch (error) { toast(error.message, "bad"); }
  }
  async revoke() {
    try { await dbPatch("um_invitations", `id=eq.${encodeURIComponent(this.id)}`, { status: "revoked" }); localStorage.removeItem(`um_invite_link_${this.id}`); toast("Invitation revoked", "good"); await this.load(true); }
    catch (error) { toast(error.message, "bad"); }
  }
  async restore() { await this.rotateLink(); }
}

class AdminProfile {
  async start() {
    if (!(await validAuth())) return renderAdminLogin();
    appRoot.innerHTML = adminShell(`<div class="admin-loading"><div class="loader-ring"></div></div>`, "profile"); bindAdminShell();
    try { const rows = await dbGet("um_owner_profile", "select=*&id=eq.1&limit=1"); this.profile = rows[0]; this.render(); }
    catch (error) { if (error.message === "AUTH_REQUIRED") return renderAdminLogin(); toast(error.message, "bad"); }
  }
  cleanup() {}
  render() {
    const data = this.profile.profile_data || {};
    appRoot.innerHTML = adminShell(`<div class="admin-page settings-page"><header class="admin-top"><div><p class="small-caps">Candidate-facing information</p><h1>My profile</h1><p>New invitations capture the current profile and standards.</p></div></header><section class="settings-grid"><form class="settings-form" data-profile-form><label>Display name<input class="input" name="displayName" value="${escapeHtml(this.profile.display_name || "Naim")}" required></label><label>Photo URL, optional<input class="input" name="photoUrl" type="url" value="${escapeHtml(this.profile.photo_url || "")}" placeholder="https://…"></label><label>Short introduction<textarea class="input notes-area" name="intro">${escapeHtml(data.intro || "")}</textarea></label><label>What she should know<textarea class="input notes-area tall" name="whatToKnow">${escapeHtml(data.what_to_know || "")}</textarea></label><label>Traits, one per line<textarea class="input notes-area tall" name="traits">${escapeHtml((data.traits || []).join("\n"))}</textarea></label><button class="button button-primary" type="submit">Save profile</button></form><aside class="settings-preview"><p class="small-caps">Preview</p><div class="portrait-card mini"><div class="portrait-monogram">N</div><div class="portrait-caption"><strong>${escapeHtml(this.profile.display_name || "Naim")}</strong><span>${escapeHtml(data.intro || "Your honest introduction appears here.")}</span></div></div><div class="honest-card"><h3>What you should know</h3><p>${escapeHtml(data.what_to_know || "Your honest disclosure appears here.")}</p></div></aside></section></div>`, "profile");
    bindAdminShell();
    appRoot.querySelector("[data-profile-form]")?.addEventListener("submit", (event) => void this.save(event));
  }
  async save(event) {
    event.preventDefault(); const form = event.currentTarget; const button = form.querySelector("button"); button.disabled = true; button.textContent = "Saving…";
    const profileData = { ...(this.profile.profile_data || {}), intro: form.intro.value.trim(), what_to_know: form.whatToKnow.value.trim(), traits: form.traits.value.split("\n").map((item) => item.trim()).filter(Boolean) };
    try { const rows = await dbPatch("um_owner_profile", "id=eq.1", { display_name: form.displayName.value.trim(), photo_url: form.photoUrl.value.trim() || null, profile_data: profileData }); this.profile = rows[0] || { ...this.profile, display_name: form.displayName.value.trim(), photo_url: form.photoUrl.value.trim() || null, profile_data: profileData }; toast("Profile saved", "good"); this.render(); }
    catch (error) { toast(error.message, "bad"); button.disabled = false; button.textContent = "Save profile"; }
  }
}

class AdminAccount {
  cleanup() {}
  async start() {
    const session = await validAuth(); if (!session) return renderAdminLogin();
    appRoot.innerHTML = adminShell(`<div class="admin-page settings-page"><header class="admin-top"><div><p class="small-caps">Owner security</p><h1>Account</h1><p>Signed in as ${escapeHtml(session.user?.email || "owner")}</p></div></header><section class="account-card"><h2>Change password</h2><p>Use at least 12 characters. This updates your Supabase owner login immediately.</p><form class="field-stack" data-password-form><label>New password<input class="input" name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input class="input" name="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="button button-primary" type="submit">Update password</button></form></section></div>`, "account");
    bindAdminShell(); appRoot.querySelector("[data-password-form]")?.addEventListener("submit", (event) => void this.save(event));
  }
  async save(event) {
    event.preventDefault(); const form = event.currentTarget; if (form.password.value !== form.confirm.value) return toast("Passwords do not match", "bad");
    const session = await validAuth(); const button = form.querySelector("button"); button.disabled = true; button.textContent = "Updating…";
    try { await fetchJson(`${SUPABASE_URL}/auth/v1/user`, { method: "PUT", headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, "Content-Type": "application/json" }, body: JSON.stringify({ password: form.password.value }) }); form.reset(); toast("Password updated", "good"); }
    catch (error) { toast(error.message, "bad"); }
    button.disabled = false; button.textContent = "Update password";
  }
}

async function boot() {
  if (activeCleanup) { try { activeCleanup(); } catch {} activeCleanup = null; }
  const current = route();
  if (current.type === "home") return renderHome();
  if (current.type === "admin-forgot") return renderPasswordResetRequest();
  if (current.type === "admin-reset") return renderPasswordReset();
  if (current.type === "admin-secure-reset") return renderSecureOwnerReset();
  if (current.type === "candidate") { const app = new CandidateExperience(current.token); activeCleanup = () => app.cleanup(); return app.start(); }
  if (current.type === "admin-candidate") { const app = new CandidateDetail(current.id); activeCleanup = () => app.cleanup(); return app.start(); }
  if (current.type === "admin-profile") { const app = new AdminProfile(); activeCleanup = () => app.cleanup(); return app.start(); }
  if (current.type === "admin-account") { const app = new AdminAccount(); activeCleanup = () => app.cleanup(); return app.start(); }
  const app = new AdminDashboard(); activeCleanup = () => app.cleanup(); return app.start();
}

window.addEventListener("hashchange", boot);
window.addEventListener("popstate", boot);
window.addEventListener("visibilitychange", () => {
  const current = route();
  if (current.type === "candidate" && document.visibilityState === "hidden") {
    // CandidateExperience records this through its own session heartbeat and interaction methods.
  }
});
boot();
</script>
</body>
